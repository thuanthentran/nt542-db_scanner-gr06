---
# Playbook riêng để rollback từ rollback_script.sql do remediation sinh ra
# Sử dụng: ansible-playbook playbook/rollback.yml -i playbook/inventory/inventory.ini -e environment=dev

- name: "Run Rollback Only"
  hosts: db_servers
  remote_user: "{{ ansible_user | default('ansible') }}"
  become: yes
  become_method: sudo

  vars_files:
    - "vars/main.yml"
    - "vars/{{ environment | default('dev') }}.yml"

  pre_tasks:
    - name: "Collect OS facts"
      setup:
        gather_subset: all

    - name: "Verify target hosts are reachable"
      ping:

  roles:
    - role: common
      tags: ['always']
    - role: deploy
      tags: ['deploy']
    - role: rollback
      tags: ['rollback']

  post_tasks:
    - name: "Display summary"
      debug:
        msg:
          - "Deployment Status: {{ deployment_status | default('completed') }}"
          - "Rollback Report: {{ rollback_report_path | default('N/A') }}"
