---
# Playbook riêng để chỉ chạy remediation sau khi audit đã xác nhận vi phạm
# Sử dụng: ansible-playbook playbook/remediate.yml -i inventory/hosts.ini -e environment=dev

- name: "Run Remediation Only"
  hosts: db_servers
  remote_user: "{{ ansible_user | default('ansible') }}"
  become: yes
  become_method: sudo

  vars_files:
    - "vars/main.yml"
    - "vars/{{ environment | default('dev') }}.yml"

  pre_tasks:
    - name: "Collect OS facts"
      setup:
        gather_subset: all

    - name: "Verify target hosts are reachable"
      ping:

  roles:
    - role: common
      tags: ['always']
    - role: deploy
      tags: ['deploy']
    - role: remediation
      tags: ['remediation']

  post_tasks:
    - name: "Display summary"
      debug:
        msg:
          - "Deployment Status: {{ deployment_status | default('completed') }}"
          - "Remediation Report: {{ remediation_report_path | default(remediation_summary.report_path | default('N/A')) }}"