---
# Biến chung cho tất cả môi trường
project_name: db_scanner
project_version: "1.0"
app_user: dbscanner
app_group: dbscanner
app_home: /opt/db_scanner
source_path: "{{ playbook_dir }}/.."

# Cấu hình Python
python_version: "3.10"
venv_path: "{{ app_home }}/venv"
requirements_file: "{{ app_home }}/requirements.txt"

# Cấu hình logging
log_dir: "/var/log/db_scanner"
log_level: "INFO"

# Cấu hình audit
audit_schedule: "0 2 * * *"  
audit_timeout: 3600  

# Cấu hình remediation
remediation_enabled: false  
remediation_backup: true  
backup_dir: "/var/backups/db_scanner"

# Cấu hình báo cáo
report_dir: "/var/reports/db_scanner"
report_format: "json,html,csv" 
report_retention_days: 90

# Cấu hình email
send_report_email: true
email_recipients:
  - "admin@company.com"
  - "dba@company.com"
smtp_server: "smtp.company.com"
smtp_port: 587

# Cấu hình database
db_connection_timeout: 30
db_query_timeout: 300
central_report_dir: "{{ source_path }}/reports"
db_driver: "ODBC Driver 17 for SQL Server"
db_server: "{{ ansible_host | default(inventory_hostname) }}"
db_port: 1433
db_name: "master"
db_encrypt: true
db_trust_server_certificate: true
db_login_timeout: 30

# Cấu hình rollback
rollback_db_user: "{{ remediation_db_user }}"
rollback_db_password: "{{ remediation_db_password }}"
rollback_script_source: "{{ central_report_dir }}/remediation_{{ inventory_hostname }}/rollback_script.sql"
rollback_local_dir: "{{ central_report_dir }}/rollback_{{ inventory_hostname }}"
rollback_remote_dir: "{{ backup_dir }}/{{ ansible_date_time.date }}"
rollback_remote_script_path: "{{ backup_dir }}/{{ ansible_date_time.date }}/rollback_script.sql"
rollback_remote_report_path: "{{ backup_dir }}/{{ ansible_date_time.date }}/rollback_report.json"

# Credential sets
audit_db_user: ""
audit_db_password: ""
remediation_db_user: ""
remediation_db_password: ""
