---
# Tasks triển khai ứng dụng
- name: "Copy application files while preserving directory structure"
  copy:
    # Đảm bảo item "scanner" không có dấu gạch chéo ở cuối
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ app_home }}/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  with_items:
    - "db_scan.py"
    - "requirements.txt"
    - "scanner" # KHÔNG để "scanner/"
  register: copy_result

- name: "Create Python virtual environment"
  command:
    cmd: "python3 -m venv {{ venv_path }}"
    creates: "{{ venv_path }}/bin/activate"
  become_user: "{{ app_user }}"

- name: "Upgrade pip in virtualenv"
  pip:
    name:
      - pip
      - setuptools
      - wheel
    state: latest
    virtualenv: "{{ venv_path }}"
  become_user: "{{ app_user }}"

- name: "Install Python dependencies"
  pip:
    requirements: "{{ app_home }}/requirements.txt"
    virtualenv: "{{ venv_path }}"
    state: present
  become_user: "{{ app_user }}"
  register: pip_result

- name: "Create configuration file"
  template:
    src: db_scanner_config.j2
    dest: "{{ app_home }}/config.ini"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  vars:
    db_server: "{{ inventory_hostname }}"
    db_instance: "MSSQLSERVER"

- name: "Create wrapper script"
  template:
    src: run_scanner.sh.j2
    dest: "{{ app_home }}/run_scanner.sh"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: "Verify deployment"
  command:
    cmd: "{{ venv_path }}/bin/python3 -m py_compile {{ app_home }}/db_scan.py"
  become_user: "{{ app_user }}"
  changed_when: false

- name: "Set deployment status"
  set_fact:
    deployment_status: "SUCCESS"
  when: (pip_result is defined and pip_result.changed) or (copy_result is defined and copy_result.changed)

- name: "Display deployment info"
  debug:
    msg:
      - "Application deployed to: {{ app_home }}"
      - "Python version: {{ ansible_python_version }}"
      - "Virtual environment: {{ venv_path }}"
