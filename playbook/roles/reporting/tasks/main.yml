---
# =========================================================
# REPORTING ROLE
# =========================================================

- name: "Aggregate audit results from all servers"
  block:

    # =====================================================
    # CREATE CENTRAL REPORT DIRECTORY (LOCALHOST)
    # =====================================================

    - name: "Create central report directory"
      file:
        path: "{{ central_report_dir }}"
        state: directory
        owner: "{{ lookup('env','USER') | default('ubuntu') }}"
        group: "{{ lookup('env','USER') | default('ubuntu') }}"
        mode: '0755'
      delegate_to: localhost
      become: false
      run_once: true

    # =====================================================
    # FIND LATEST AUDIT DIRECTORY ON REMOTE HOST
    # =====================================================

    - name: "Find the latest audit report directory"
      find:
        paths: "/var/reports/db_scanner"
        patterns: "audit_*"
        file_type: directory
      register: found_reports

    - name: "Select the most recent report directory"
      set_fact:
        latest_audit_dir: >-
          {{
            found_reports.files
            | sort(attribute='mtime', reverse=true)
            | first
          }}
      when: found_reports.matched > 0

    - name: "Debug latest audit directory"
      debug:
        var: latest_audit_dir
      when: latest_audit_dir is defined

    # =====================================================
    # CREATE ARCHIVE ON REMOTE HOST
    # =====================================================

    - name: "Archive audit results"
      archive:
        path: "{{ latest_audit_dir.path }}"
        dest: "/opt/audit_results_{{ inventory_hostname }}.tar.gz"
        format: gz
      when: latest_audit_dir is defined

    # =====================================================
    # FETCH ARCHIVE TO LOCALHOST
    # =====================================================

    - name: "Fetch audit results as an archive"
      become: true
      fetch:
        src: "/opt/audit_results_{{ inventory_hostname }}.tar.gz"
        dest: "{{ central_report_dir }}/{{ inventory_hostname }}/"
        flat: yes
      when: latest_audit_dir is defined

    # =====================================================
    # FETCH REMEDIATION REPORT
    # =====================================================

    - name: "Fetch remediation results (if applicable)"
      fetch:
        src: "{{ remediation_summary.report_path }}"
        dest: "{{ central_report_dir }}/remediation_{{ inventory_hostname }}/"
        flat: no
      ignore_errors: yes
      when:
        - remediation_summary is defined
        - remediation_summary.report_path != 'N/A'

# =========================================================
# GENERATE CONSOLIDATED REPORTS
# =========================================================

- name: "Generate consolidated report"
  block:

    - name: "Create consolidated HTML report"
      template:
        src: consolidated_report.html.j2
        dest: "{{ central_report_dir }}/CONSOLIDATED_REPORT.html"
        owner: "{{ lookup('env','USER') | default('ubuntu') }}"
        group: "{{ lookup('env','USER') | default('ubuntu') }}"
        mode: '0644'
      delegate_to: localhost
      become: false
      run_once: true

    - name: "Create consolidated CSV report"
      template:
        src: consolidated_report.csv.j2
        dest: "{{ central_report_dir }}/CONSOLIDATED_REPORT.csv"
        owner: "{{ lookup('env','USER') | default('ubuntu') }}"
        group: "{{ lookup('env','USER') | default('ubuntu') }}"
        mode: '0644'
      delegate_to: localhost
      become: false
      run_once: true

    - name: "Create consolidated JSON report"
      template:
        src: consolidated_report.json.j2
        dest: "{{ central_report_dir }}/CONSOLIDATED_REPORT.json"
        owner: "{{ lookup('env','USER') | default('ubuntu') }}"
        group: "{{ lookup('env','USER') | default('ubuntu') }}"
        mode: '0644'
      delegate_to: localhost
      become: false
      run_once: true

  # --- ĐƯA TOÀN BỘ VARS XUỐNG DƯỚI ĐÁY CỦA BLOCK ---
  vars:
    report_timestamp: "{{ ansible_facts['date_time']['iso8601'] }}"
    total_servers: "{{ groups['db_servers'] | length }}"
    servers_audited: "{{ groups['db_servers'] }}"
    report_path: "{{ central_report_dir }}"
    audit_summaries: >-
      {{
        hostvars
        | dict2items
        | map(attribute='value.audit_summary')
        | list
      }}
  when: audit_summary is defined

# =========================================================
# COMPRESS ALL REPORTS
# =========================================================

- name: "Compress all reports"
  block:

    - name: "Archive reports"
      archive:
        path: "{{ central_report_dir }}"
        dest: "{{ central_report_dir }}/consolidated_reports_{{ ansible_date_time.date }}.tar.gz"
        format: gz
      delegate_to: localhost
      become: false
      run_once: true
      register: report_archive

    - name: "Calculate archive checksum"
      stat:
        path: "{{ report_archive.dest }}"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: archive_checksum


# =========================================================
# CLEAN OLD REPORTS
# =========================================================

- name: "Clean up old reports"
  block:

    - name: "Find old reports"
      find:
        paths: "{{ report_dir }}"
        age: "{{ report_retention_days }}d"
        recurse: yes
        file_type: file
      register: old_reports

    - name: "Remove old reports"
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_reports.files }}"
      when: old_reports.matched > 0

    - name: "Clean empty directories"
      shell: "find {{ report_dir }} -type d -empty -delete"
      changed_when: false

# =========================================================
# DISPLAY SUMMARY
# =========================================================

- name: "Display reporting summary"
  debug:
    msg:
      - "Report Location: {{ central_report_dir }}"
      - "Archive: {{ report_archive.dest | default('N/A') }}"
      - "Archive SHA256: {{ archive_checksum.stat.checksum | default('N/A') }}"
      - "Reports kept for: {{ report_retention_days }} days"
      - "Email sent to: {{ email_recipients | join(', ') if send_report_email else 'N/A' }}"
  delegate_to: localhost
  become: false
  run_once: true
