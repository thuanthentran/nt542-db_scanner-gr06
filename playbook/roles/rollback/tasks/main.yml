---
# Tasks thực thi rollback từ file rollback_script.sql do remediation sinh ra

- name: "Validate SQL Account configuration for rollback"
  assert:
    that:
      - rollback_db_user is defined
      - rollback_db_password is defined
      - (rollback_db_user | length) > 0
      - (rollback_db_password | length) > 0
    fail_msg: "rollback_db_user/rollback_db_password are required for rollback SQL authentication. Provide them from vault or extra vars."
  no_log: true

- name: "Check rollback script exists on controller"
  stat:
    path: "{{ rollback_script_source }}"
  delegate_to: localhost
  register: rollback_script_source_stat

- name: "Ensure rollback script was generated by remediation"
  assert:
    that:
      - rollback_script_source_stat.stat.exists
    fail_msg: "rollback_script.sql not found at {{ rollback_script_source }}. Run remediation first or provide rollback_script_source."

- name: "Create local rollback report directory"
  file:
    path: "{{ rollback_local_dir }}"
    state: directory
    owner: "{{ lookup('env','USER') | default('ubuntu') }}"
    group: "{{ lookup('env','USER') | default('ubuntu') }}"
    mode: '0755'
  delegate_to: localhost
  become: false

- name: "Copy rollback script to local rollback directory"
  copy:
    src: "{{ rollback_script_source }}"
    dest: "{{ rollback_local_dir }}/rollback_script.sql"
    mode: '0644'
  delegate_to: localhost
  become: false

- name: "Create rollback staging directory on remote host"
  file:
    path: "{{ rollback_remote_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: "Stage rollback script on remote host"
  copy:
    src: "{{ rollback_script_source }}"
    dest: "{{ rollback_remote_script_path }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'

- name: "Execute rollback script"
  command:
    cmd: "{{ venv_path }}/bin/python3 {{ app_home }}/rollback.py {{ rollback_remote_script_path }}"
  become_user: "{{ app_user }}"
  environment:
    PYTHONPATH: "{{ app_home }}"
    DB_DRIVER: "{{ db_driver }}"
    DB_SERVER: "{{ db_server | default(ansible_host | default(inventory_hostname)) }}"
    DB_PORT: "{{ db_port | string }}"
    DB_NAME: "{{ db_name }}"
    DB_USER: "{{ rollback_db_user }}"
    DB_PASSWORD: "{{ rollback_db_password }}"
    DB_ENCRYPT: "{{ 'yes' if db_encrypt else 'no' }}"
    DB_TRUST_SERVER_CERTIFICATE: "{{ 'yes' if db_trust_server_certificate else 'no' }}"
    DB_LOGIN_TIMEOUT: "{{ db_login_timeout | string }}"
  register: rollback_exec
  no_log: true

- name: "Store rollback report on remote host"
  copy:
    content: "{{ rollback_exec.stdout | default('{}') }}"
    dest: "{{ rollback_remote_report_path }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  when: rollback_exec.stdout is defined

- name: "Fetch rollback report to localhost"
  fetch:
    src: "{{ rollback_remote_report_path }}"
    dest: "{{ rollback_local_dir }}/"
    flat: yes

- name: "Set rollback summary"
  set_fact:
    rollback_summary:
      status: "SUCCESS"
      script_path: "{{ rollback_local_dir }}/rollback_script.sql"
      report_path: "{{ rollback_local_dir }}/rollback_report.json"
      remote_report_path: "{{ rollback_remote_report_path }}"

- name: "Expose rollback report path for playbook summary"
  set_fact:
    rollback_report_path: "{{ rollback_local_dir }}/rollback_report.json"