---
# Tasks chung cho tất cả roles
- name: "Update package manager"
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: "Install basic dependencies"
  package:
    name: "{{ item }}"
    state: present
  loop:
    - curl
    - wget
    - python3
    - python3-pip
    - python3-venv
    - sudo
  register: packages_installed
  changed_when: packages_installed.changed

- name: "Create application group"
  group:
    name: "{{ app_group }}"
    state: present

- name: "Create application user"
  user:
    group: "{{ app_group }}"
    name: "{{ app_user }}"
    groups: "{{ app_group }},sudo"
    home: "{{ app_home }}"
    shell: /bin/bash
    state: present

- name: "Create necessary directories"
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop:
    - "{{ app_home }}"
    - "{{ log_dir }}"
    - "{{ backup_dir }}"
    - "{{ report_dir }}"

- name: "Set up logging"
  template:
    src: logrotate.j2
    dest: /etc/logrotate.d/db_scanner
    owner: root
    group: root
    mode: '0644'

- name: "Add Microsoft GPG key"
  ansible.builtin.apt_key:
    url: https://packages.microsoft.com/keys/microsoft.asc
    state: present

- name: "Add Microsoft APT repository (Ubuntu 24.04)"
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64,armhf,arm64] https://packages.microsoft.com/ubuntu/24.04/prod noble main"
    state: present
    filename: mssql-release

- name: "Install Microsoft ODBC Driver and unixODBC dependencies"
  ansible.builtin.apt:
    name:
      - msodbcsql17
      - unixodbc
      - unixodbc-dev
    state: present
    update_cache: yes
  environment:
    ACCEPT_EULA: 'Y'