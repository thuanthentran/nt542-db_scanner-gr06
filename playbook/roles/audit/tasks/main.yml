---
# Tasks thực hiện audit
- name: "Create audit working directory"
  file:
    path: "{{ report_dir }}/audit_{{ ansible_date_time.iso8601 | replace(':', '-') }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  register: audit_dir

- name: "Validate SQL Account configuration for audit"
  assert:
    that:
      - audit_db_user is defined
      - audit_db_password is defined
      - (audit_db_user | length) > 0
      - (audit_db_password | length) > 0
    fail_msg: "audit_db_user/audit_db_password are required for audit SQL authentication. Provide them from vault or extra vars."
  no_log: true

- name: "Run full audit scan"
  shell: |
    set -o pipefail
    {{ venv_path }}/bin/python3 {{ app_home }}/db_scan.py 2>&1 | tee {{ audit_dir.path }}/audit_results.log
  args:
    executable: /bin/bash
    creates: "{{ audit_dir.path }}/audit_results.log"
  become_user: "{{ app_user }}"
  environment:
    PYTHONPATH: "{{ app_home }}"
    DB_DRIVER: "{{ db_driver }}"
    DB_SERVER: "{{ db_server | default(ansible_host | default(inventory_hostname)) }}"
    DB_PORT: "{{ db_port | string }}"
    DB_NAME: "{{ db_name }}"
    DB_USER: "{{ audit_db_user }}"
    DB_PASSWORD: "{{ audit_db_password }}"
    DB_ENCRYPT: "{{ 'yes' if db_encrypt else 'no' }}"
    DB_TRUST_SERVER_CERTIFICATE: "{{ 'yes' if db_trust_server_certificate else 'no' }}"
    DB_LOGIN_TIMEOUT: "{{ db_login_timeout | string }}"
  register: audit_execution
  timeout: 3600

- name: "Store audit JSON output"
  copy:
    content: "{{ audit_execution.stdout }}"
    dest: "{{ audit_dir.path }}/audit_results.json"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  when: audit_execution.stdout is defined

- name: "Set audit status"
  set_fact:
    audit_status: "{{ 'SUCCESS' if audit_execution.rc == 0 else 'FAILED' }}"
    audit_results_path: "{{ audit_dir.path }}"

- name: "Parse audit results"
  stat:
    path: "{{ audit_dir.path }}/audit_results.json"
  register: audit_results_file

- name: "Read audit summary"
  slurp:
    src: "{{ audit_dir.path }}/audit_results.json"
  register: audit_results_content
  when: audit_results_file.stat.exists

- name: "Display audit summary"
  debug:
    msg:
      - "Audit Status: {{ audit_status }}"
      - "Results stored at: {{ audit_dir.path }}"
      - "Execution time: {{ audit_execution.end | default('N/A') }}"
  when: audit_results_file.stat.exists

- name: "Generate audit report"
  template:
    src: audit_report.html.j2
    dest: "{{ audit_dir.path }}/audit_report.html"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  vars:
    audit_timestamp: "{{ ansible_date_time.iso8601 }}"
    audit_hostname: "{{ inventory_hostname }}"
    audit_status_info: "{{ audit_status }}"

- name: "Compress audit results"
  archive:
    path: "{{ audit_dir.path }}"
    dest: "{{ audit_dir.path }}.tar.gz"
    format: gz
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  register: audit_archive

- name: "Create audit task summary"
  set_fact:
    audit_summary:
      status: "{{ audit_status }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      server: "{{ inventory_hostname }}"
      results_path: "{{ audit_dir.path }}"
      archive_path: "{{ audit_archive.dest }}"
      findings: "{{ (audit_results_content.content | b64decode | from_json).findings | default(0) if audit_results_file.stat.exists else 'N/A' }}"
